name: RSI research integrity and local-demo format checks

on:
  push:
    branches: [research/rsi-automation-v1]
    paths:
      - "research/rsi/trajectory/**"
      - "research/rsi/preflight_native_upstream.py"
      - "research/rsi/test_preflight_native_upstream.py"
      - "research/rsi/test_native_workflow_preflight.py"
      - "research/rsi/verify_pinned_local_checkout.py"
      - "research/rsi/test_verify_pinned_local_checkout.py"
      - "research/rsi/escrow_native_artifacts.py"
      - "research/rsi/test_escrow_native_artifacts.py"
      - "research/rsi/stage_e5_escrow.py"
      - "research/rsi/test_stage_e5_escrow.py"
      - ".github/workflows/rsi-e3-e4-escrow.yml"
      - ".github/workflows/rsi-e2-teacher.yml"
      - ".github/workflows/rsi-e3-distill.yml"
      - ".github/workflows/rsi-e4-bc.yml"
      - ".github/workflows/taisei-rsi-pilot.yml"
      - ".github/workflows/rsi-e5-native-replay.yml"
      - "my_test/UPSTREAM.lock"
      - "research/rsi/competence_eval.py"
      - "research/rsi/test_competence_eval.py"
      - "research/rsi/train_reward_ablation.py"
      - "research/rsi/test_reward_ablation.py"
      - "research/rsi/risk_aware_teacher.py"
      - "research/rsi/test_risk_aware_teacher.py"
      - "research/rsi/e2_evaluate_teacher.py"
      - "research/rsi/e2_compare_teacher.py"
      - "research/rsi/test_e2_teacher_compare.py"
      - "research/rsi/policy_format_preflight.py"
      - "research/rsi/test_policy_format_preflight.py"
      - ".github/workflows/rsi-research-validation.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check append-only trajectory history
        run: |
          python - <<'PY'
          import pathlib, subprocess
          p="research/rsi/trajectory/events.jsonl"
          current=pathlib.Path(p).read_bytes()
          prior=subprocess.run(["git","show","HEAD^:"+p],capture_output=True)
          if prior.returncode==0:
              assert current.startswith(prior.stdout), "Ledger history mutated rather than extended"
          PY
      - name: Validate research and format tests (no native game fallback)
        run: |
          python -m unittest discover -s research/rsi/trajectory -p 'test_*.py' -v
          python -m unittest discover -s research/rsi -p 'test_preflight_native_upstream.py' -v
          python -m unittest discover -s research/rsi -p 'test_native_workflow_preflight.py' -v
          python -m unittest discover -s research/rsi -p 'test_verify_pinned_local_checkout.py' -v
          python -m unittest discover -s research/rsi -p 'test_escrow_native_artifacts.py' -v
          python -m unittest discover -s research/rsi -p 'test_stage_e5_escrow.py' -v
          python -m unittest discover -s research/rsi -p 'test_e5_audit_replay.py' -v
          python -m unittest discover -s research/rsi -p 'test_policy_format_preflight.py' -v
          python -m unittest discover -s research/rsi -p 'test_competence_eval.py' -v
          python -m unittest discover -s research/rsi -p 'test_reward_ablation.py' -v
          python -m unittest discover -s research/rsi -p 'test_risk_aware_teacher.py' -v
          python -m unittest discover -s research/rsi -p 'test_e2_teacher_compare.py' -v
      - name: Diagnose pinned source access without running native Taisei
        run: |
          set +e
          python research/rsi/preflight_native_upstream.py \
            --lock my_test/UPSTREAM.lock \
            --out research_evidence/upstream_preflight.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          echo "Upstream access preflight exit=$rc (blocked source is diagnostic, not a source-test failure)"
      - name: Generate research timeline digest
        run: |
          python research/rsi/trajectory/ledger.py summarize \
            --ledger research/rsi/trajectory/events.jsonl \
            --out research_evidence/rsi_digest.json
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi-research-integrity
          path: |
            research_evidence/rsi_digest.json
            research_evidence/upstream_preflight.json
          if-no-files-found: ignore
