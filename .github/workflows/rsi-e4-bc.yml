name: E4 native Alice rebalanced imitation — archived teacher data

on:
  push:
    branches: [research/rsi-automation-v1]
    paths:
      - "research/rsi/E4_BC_RUN_REQUEST.md"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: taisei-native-serial
  cancel-in-progress: false

jobs:
  e4-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Preflight locked native Taisei source before expensive dependencies
        run: |
          python research/rsi/preflight_native_upstream.py \
            --lock my_test/UPSTREAM.lock \
            --out my_test/results/rsi_e4_class_aware_bc/upstream_preflight.json
      - name: Recover immutable genuine E3 demonstration data and original BC checkpoint
        uses: actions/download-artifact@v4
        with:
          name: taisei-e3-distillation-40219788151
          run-id: 40219788151
          github-token: ${{ github.token }}
          repository: Borui66111/touhou_Taisei_rl
          path: my_test/results/e3_artifact
      - name: Install pinned native Taisei and learning dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build pkg-config gettext \
            libfreetype-dev libwebp-dev libzstd-dev zlib1g-dev libpng-dev libssl-dev \
            libopusfile-dev libunibreak-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxrender-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols
          for p in libcglm-dev libsdl3-dev; do
            if apt-cache show "$p" >/dev/null 2>&1; then sudo apt-get install -y "$p"; fi
          done
          python -m pip install 'meson>=1.8' ninja 'numpy>=1.24' 'backports.zstd' torch
          python -c 'from backports.zstd import ZstdCompressor,ZstdDecompressor; print("Native resource packer ready")'
      - name: Verify E4 class weights and pinned source hashes
        run: |
          python -m unittest discover -s research/rsi -p 'test_e4_rebalanced_bc.py' -v
      - name: Learn from existing game data and compare on fresh real-game seeds
        working-directory: my_test
        run: bash ../research/rsi/run_e4_bc.sh
      - name: Save offline training, paired native evaluation and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taisei-e4-rebalanced-bc-${{ github.run_id }}
          path: my_test/results/rsi_e4_class_aware_bc/
          if-no-files-found: warn
          retention-days: 21
