name: Taisei RSI pilot (native, fail closed)

on:
  push:
    branches: [research/rsi-automation-v1]
    paths:
      - "research/rsi/PILOT_RUN_REQUEST.md"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: taisei-rsi-pilot
  cancel-in-progress: false

jobs:
  native-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install actual native game build dependencies and PPO
        run: |
          sudo apt-get update
          sudo apt-get install -y git build-essential cmake ninja-build pkg-config gettext \
            libfreetype-dev libwebp-dev libzstd-dev zlib1g-dev libpng-dev libssl-dev \
            libopusfile-dev libunibreak-dev libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxrender-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols
          for p in libcglm-dev libsdl3-dev; do
            if apt-cache show "$p" >/dev/null 2>&1; then sudo apt-get install -y "$p"; fi
          done
          python -m pip install 'meson>=1.8' ninja 'numpy>=1.24' 'pytest>=8' 'backports.zstd' \
            torch --index-url https://pypi.org/simple
      - name: Verify Taisei native resource packer Python package
        run: python -c 'from backports.zstd import ZstdCompressor, ZstdDecompressor; print("backports.zstd ready")'
      - name: Validate movement diagnostic source tests
        run: python -m unittest discover -s research/rsi -p test_e2_trace.py -v
      - name: Build, smoke, train and compare (development seeds only)
        working-directory: my_test
        run: |
          bash ../research/rsi/run_pilot.sh
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taisei-rsi-pilot-${{ github.run_id }}
          path: |
            my_test/results/rsi_pilot/
          if-no-files-found: warn
          retention-days: 14
